<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | AAXORVYN Solutions</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="logo-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a; --panel: #0a0d16; --ink: #e9edf5; --muted: #8b95ab;
    --blue: #6f9bff; --line: rgba(150,165,200,.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .wrap {
    max-width: 580px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 3rem 2rem;
    box-shadow: 0 25px 60px -20px rgba(0,0,0,.7);
  }
  .logo { height: 42px; margin-bottom: 2rem; }
  .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(3.5rem, 10vw, 5rem);
    font-weight: 700;
    color: var(--blue);
    line-height: 1;
    margin-bottom: 1rem;
    letter-spacing: -0.05em;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.6rem;
    margin-bottom: 1rem;
  }
  p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 2rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    background: linear-gradient(180deg, #f8fafc, #c3cddf);
    color: #05070d;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    padding: .9rem 2rem;
    border-radius: 99px;
    text-decoration: none;
    transition: transform .2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="wrap">
    <a href="/"><img src="logonew_AAXORVYN-sm.webp" alt="AAXORVYN Solutions" class="logo"></a>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/" class="btn">Back to Homepage &rarr;</a>
  </div>
</body>
</html>
